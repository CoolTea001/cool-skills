<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#020420" />
<meta name="color-scheme" content="dark" />
<title>CoolTeach — Course Preview</title>
<link rel="stylesheet" href="../../assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="inner">
      <div class="title-block">
        <h1 id="courseTitle" class="course-title">Loading…</h1>
      </div>
      <div class="desc-block">
        <p id="courseDesc" class="course-desc"></p>
      </div>
      <div class="spacer-top" aria-hidden="true"></div>
      <div class="section-divider" aria-hidden="true"></div>
      <div class="main-row">
        <aside class="lesson-list">
          <div class="list-head">
            <span id="lessonCount" class="list-title">Lessons · 0</span>
            <span id="progressInline" class="list-progress">0 / 0</span>
          </div>
          <nav id="navList" class="nav-cards" aria-label="Lessons"></nav>
          <!-- hidden progress for legacy JS compat -->
          <div style="display:none"><span id="progressText">0 / 0</span><div id="progressFill" style="width:0%"></div></div>
        </aside>
        <main id="main" class="content-block"></main>
      </div>
    </div>
  </div>

<script>window.__COURSE__ = {"slug":"demo","title":"Demo Course — Replace with real data","description":"Run /cool-teach to generate a real course preview.","mission":{"why":"","success":[],"constraints":[]}};</script>
<!-- LESSONS -->
<script src="./lessons/0001-demo-lesson.js"></script>
<script src="../../assets/app.js"></script>
</body>
</html>
