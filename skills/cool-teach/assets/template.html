<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#020420" />
<meta name="color-scheme" content="dark light" />
<title>CoolTeach — Course Preview</title>
<link rel="stylesheet" href="../../assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Cool Teach <span class="brand-version" data-version>v{{COOLTEACH_VERSION}}</span></div>
      <div class="topbar-actions">
        <div class="lang-wrap">
          <button id="langBtn" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" title="语言 / Language">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
          </button>
          <div id="langMenu" class="dropdown" role="menu" hidden>
            <button class="dropdown-item" role="menuitemradio" aria-checked="true" data-lang="en">English</button>
            <button class="dropdown-item" role="menuitemradio" aria-checked="false" data-lang="zh">中文</button>
          </div>
        </div>
        <button id="themeBtn" class="icon-btn" title="切换主题">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="inner">
      <div class="hero">
        <div class="title-block">
          <h1 id="courseTitle" class="course-title">Loading…</h1>
        </div>
        <div class="desc-block">
          <p id="courseDesc" class="course-desc"></p>
        </div>
      </div>
      <div class="spacer-top" aria-hidden="true"></div>
      <div class="section-divider" aria-hidden="true"></div>
      <div class="main-row">
        <aside class="lesson-list">
          <div class="list-head">
            <span id="lessonCount" class="list-title">Lessons · 0</span>
          </div>
          <nav id="navList" class="nav-cards" aria-label="Lessons"></nav>
          <!-- hidden progress for legacy JS compat -->
          <div style="display:none"><span id="progressText">0 / 0</span><div id="progressFill" style="width:0%"></div></div>
        </aside>
        <main id="main" class="content-block"></main>
      </div>
    </div>
  </div>

<script>window.__COURSE__ = {"slug":"demo","title":"Demo Course — Replace with real data","description":"Run /cool-teach to generate a real course preview.","mission":{"why":"","success":[],"constraints":[]}};</script>
<script>window.__COOLTEACH_META__ = {"templateVersion":"{{COOLTEACH_VERSION}}","generatedAt":"{{GENERATED_AT}}"};</script>
<!-- LESSONS -->
<script src="./lessons/0001-demo-lesson.js"></script>
<script src="../../assets/marked.min.js"></script>
<script src="../../assets/app.js"></script>
</body>
</html>
